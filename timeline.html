<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light only">
<title>RegisterBuddy — Capacity: phase timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#F3F0E9;color:#14213D;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif}
.wrap{max-width:1700px;margin:0 auto;padding:20px} svg{width:100%;height:auto;display:block}
.foot{display:flex;justify-content:space-between;gap:12px;padding:8px 20px 28px;font-size:13px;color:#5E6779;max-width:1700px;margin:0 auto} a{color:#1F4E89}</style></head>
<body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#14213D">
<rect width="1700" height="930" fill="#F3F0E9"/>
<text x="60" y="52" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600">Capacity planning - five phases, four gates, one fixed date</text>
<text x="60" y="78" fill="#5E6779" font-size="14">Same ten named sites throughout. The sequence is committed; the investment is gated. Rollback at every phase: flag off, the export still works, recorded assignments and exceptions are kept.</text>
<line x1="170" y1="118" x2="1640" y2="118" stroke="#14213D" stroke-width="1.5"/>
<line x1="252" y1="112" x2="252" y2="124" stroke="#14213D"/><text x="258" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">OCT 2026</text>
<line x1="505" y1="112" x2="505" y2="124" stroke="#14213D"/><text x="511" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">NOV 2026</text>
<line x1="750" y1="112" x2="750" y2="124" stroke="#14213D"/><text x="756" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">DEC 2026</text>
<line x1="1003" y1="112" x2="1003" y2="124" stroke="#14213D"/><text x="1009" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">JAN 2027</text>
<line x1="1256" y1="112" x2="1256" y2="124" stroke="#14213D"/><text x="1262" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">FEB 2027</text>
<line x1="1485" y1="112" x2="1485" y2="124" stroke="#14213D"/><text x="1491" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">MAR 2027</text>
<rect x="799" y="128" width="90" height="682" fill="#F2D42C" opacity=".28"/><rect x="799" y="128" width="90" height="682" fill="none" stroke="#14213D" stroke-dasharray="4 4"/>
<text x="844" y="152" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="600">December finals</text><text x="844" y="170" text-anchor="middle" font-size="11.5" fill="#5E6779">Dec 7–18 · the fixed date</text>
<text x="60" y="202" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 0</text><text x="60" y="220" font-size="12.5" fill="#5E6779">Validate</text>
<rect x="235" y="180" width="90" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="235" y="173" font-size="11.5" fill="#5E6779">Sep 29 – Oct 10</text>
<text x="235" y="240" font-size="12.5">Data pull across 1,130 sites · recruit ten sites · interviews</text>
<text x="235" y="257" font-size="12.5" fill="#5E6779">Test 1: flagged 'last finals' report page for the ten, telemetry on</text>
<text x="235" y="276" font-size="12"><tspan font-weight="600">Gate</tspan> ≥20% of sites surge · 4 of 6 large-site directors name a bad call and act on the report</text>
<text x="235" y="292" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Better exports. Stop.</tspan></text>
<polygon points="325,187 338,200 325,213 312,200" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="336" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 1</text><text x="60" y="354" font-size="12.5" fill="#5E6779">Sense</text>
<rect x="350" y="314" width="204" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="350" y="307" font-size="11.5" fill="#5E6779">Oct 13 – Nov 7</text>
<text x="350" y="374" font-size="12.5">Must-have: capacity model - rooms, staff, hours, exceptions as events</text>
<text x="350" y="391" font-size="12.5" fill="#5E6779">Board from live bookings where allocation is the pain · nudges in the LMS or by email</text>
<text x="350" y="410" font-size="12"><tspan font-weight="600">Gate</tspan> Nov 7: 4 of 6 large sites configured and logging exceptions · board sites plan finals in-platform by Nov 21</text>
<text x="350" y="426" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Fix the model or the board. Don't forecast yet.</tspan></text>
<polygon points="554,321 567,334 554,347 541,334" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="470" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 2</text><text x="60" y="488" font-size="12.5" fill="#5E6779">Project and negotiate</text>
<rect x="578" y="448" width="204" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="578" y="441" font-size="11.5" fill="#5E6779">Nov 10 – Dec 5</text>
<text x="578" y="508" font-size="12.5">Projection from declared demand (Banner, LMS, accommodations office), expected + higher case</text>
<text x="578" y="525" font-size="12.5" fill="#5E6779">Booking hint within the exam window + DR waitlist · hand-built forecast ~Nov 17 as a fallback</text>
<text x="578" y="544" font-size="12"><tspan font-weight="600">Gate</tspan> On December: unmet DR requirements down (like-for-like) · 3 of 6 sites document a decision it changed</text>
<text x="578" y="560" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Keep the board and the report. Alerts that are wrong come off.</tspan></text>
<polygon points="782,455 796,468 782,481 770,468" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="604" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 3</text><text x="60" y="622" font-size="12.5" fill="#5E6779">Recommend and monetize</text>
<rect x="1085" y="582" width="376" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="1085" y="575" font-size="11.5" fill="#5E6779">Jan 11 – Feb 26</text>
<text x="921" y="642" font-size="12.5">Costed recommendations, never auto-applied · budget report as a button</text>
<text x="921" y="659" font-size="12.5" fill="#5E6779">$1,200 module on the $3,600 tier · launch at the February conference with reference sites</text>
<text x="921" y="678" font-size="12"><tspan font-weight="600">Gate</tspan> Purchasing decision from 2+ pilot buyers, then attach in the first renewal cycle</text>
<text x="921" y="694" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Stays a pilot feature.</tspan></text>
<polygon points="1460,589 1473,602 1460,615 1447,602" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="738" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 4</text><text x="60" y="756" font-size="12.5" fill="#5E6779">Portfolio</text>
<rect x="1485" y="716" width="155" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<polygon points="1639,712 1654,736 1639,760" fill="#F2CFAF" stroke="#14213D"/>
<text x="1485" y="709" font-size="11.5" fill="#5E6779">Later</text>
<text x="921" y="776" font-size="12.5">Same engine in advising centers, queue management, or a second scheduling portco - a hypothesis</text>
<text x="921" y="795" font-size="12"><tspan font-weight="600">Gate</tspan> A second use case validated</text>
<rect x="60" y="879" width="22" height="14" fill="#F2CFAF" stroke="#14213D" rx="2"/><text x="90" y="890" font-size="12.5" fill="#5E6779">What ships</text>
<polygon points="215,876 226,886 215,896 204,886" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/><text x="238" y="890" font-size="12.5" fill="#5E6779">Gate - what's measured, the threshold, and what happens if it fails</text>
<rect x="700" y="879" width="22" height="14" fill="#F2D42C" opacity=".28" stroke="#14213D" stroke-dasharray="3 3"/><text x="730" y="890" font-size="12.5" fill="#5E6779">December finals - phases 0 to 2 land before it</text>
<text x="1640" y="890" text-anchor="end" font-size="12" fill="#5E6779">October it's a report for ten directors · December it's the board · February it's a button</text>
</svg></div>
