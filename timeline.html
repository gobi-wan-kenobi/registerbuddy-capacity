<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light only">
<title>RegisterBuddy — Capacity: phase timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#F3F0E9;color:#14213D;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif}
.wrap{max-width:1700px;margin:0 auto;padding:20px} svg{width:100%;height:auto;display:block}
.foot{display:flex;justify-content:space-between;gap:12px;padding:8px 20px 28px;font-size:13px;color:#5E6779;max-width:1700px;margin:0 auto} a{color:#1F4E89}</style></head>
<body><div class="wrap"><svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#14213D">
<rect width="1700" height="900" fill="#F3F0E9"/>
<text x="60" y="52" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600">Capacity planning - five phases, four gates, one fixed date</text>
<text x="60" y="78" fill="#5E6779" font-size="14">Same ten named sites throughout. Rollback at every phase is the same sentence: flag off, the export still works, the spreadsheet is never deleted.</text>
<line x1="170" y1="118" x2="1640" y2="118" stroke="#14213D" stroke-width="1.5"/>
<line x1="252" y1="112" x2="252" y2="124" stroke="#14213D"/><text x="258" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">OCT 2026</text>
<line x1="505" y1="112" x2="505" y2="124" stroke="#14213D"/><text x="511" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">NOV 2026</text>
<line x1="750" y1="112" x2="750" y2="124" stroke="#14213D"/><text x="756" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">DEC 2026</text>
<line x1="1003" y1="112" x2="1003" y2="124" stroke="#14213D"/><text x="1009" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">JAN 2027</text>
<line x1="1256" y1="112" x2="1256" y2="124" stroke="#14213D"/><text x="1262" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">FEB 2027</text>
<line x1="1485" y1="112" x2="1485" y2="124" stroke="#14213D"/><text x="1491" y="106" font-size="12" fill="#5E6779" letter-spacing="1.5">MAR 2027</text>
<rect x="799" y="128" width="90" height="652" fill="#F2D42C" opacity=".28"/><rect x="799" y="128" width="90" height="652" fill="none" stroke="#14213D" stroke-dasharray="4 4"/>
<text x="844" y="152" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="600">December finals</text><text x="844" y="170" text-anchor="middle" font-size="11.5" fill="#5E6779">Dec 7–18 · the fixed date</text>
<text x="60" y="202" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 0</text><text x="60" y="220" font-size="12.5" fill="#5E6779">Validate</text>
<rect x="235" y="180" width="90" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="235" y="173" font-size="11.5" fill="#5E6779">Sep 29 – Oct 10</text>
<text x="235" y="240" font-size="12.5">Data pull across 1,130 sites · recruit ten sites · interviews · Test 1: flagged 'last finals' report page, telemetry on</text>
<text x="235" y="260" font-size="12"><tspan font-weight="600">Gate</tspan> ≥20% of sites surge · 5 of 8 directors name a bad call · half the cohort acts</text>
<text x="235" y="277" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Better exports. Stop.</tspan></text>
<polygon points="325,187 338,200 325,213 312,200" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="330" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 1</text><text x="60" y="348" font-size="12.5" fill="#5E6779">Sense</text>
<rect x="350" y="308" width="204" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="350" y="301" font-size="11.5" fill="#5E6779">Oct 13 – Nov 7</text>
<text x="350" y="368" font-size="12.5">The board, from live bookings - rooms, staff, stagger rule, exceptions as events · instructor nudges 72/48/24h in Canvas / Blackboard</text>
<text x="350" y="388" font-size="12"><tspan font-weight="600">Gate</tspan> By Nov 21: 5 of 8 sites plan finals in-platform - spreadsheet abandoned</text>
<text x="350" y="405" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Fix the board. Don't forecast yet.</tspan></text>
<polygon points="554,315 567,328 554,341 541,328" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="458" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 2</text><text x="60" y="476" font-size="12.5" fill="#5E6779">Project and negotiate</text>
<rect x="578" y="436" width="204" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="578" y="429" font-size="11.5" fill="#5E6779">Nov 10 – Dec 5</text>
<text x="578" y="496" font-size="12.5">Projection from declared demand (Banner, LMS, accommodations office) vs configured capacity · booking-page hint + DR waitlist · Test 2: hand-built forecast ~Nov 17</text>
<text x="578" y="516" font-size="12"><tspan font-weight="600">Gate</tspan> Judged on December: incidents down vs last year · directors act on ≥50% of alerts</text>
<text x="578" y="533" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Alerts are noise. Tune or turn off. Keep the board.</tspan></text>
<polygon points="782,443 796,456 782,469 770,456" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="586" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 3</text><text x="60" y="604" font-size="12.5" fill="#5E6779">Recommend and monetize</text>
<rect x="1085" y="564" width="376" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<text x="1085" y="557" font-size="11.5" fill="#5E6779">Jan 11 – Feb 26</text>
<text x="1085" y="624" font-size="12.5">Recommendations, reviewed never auto-applied · budget report as a button</text><text x="1085" y="640" font-size="12.5" fill="#5E6779">$1,200 module on the $3,600 tier · launch at NCTA, February</text>
<text x="1085" y="660" font-size="12"><tspan font-weight="600">Gate</tspan> Attach in the first renewal cycle</text>
<text x="1085" y="677" font-size="12"><tspan font-weight="600" fill="#B8322B">If not</tspan> <tspan fill="#5E6779">Stays a pilot feature.</tspan></text>
<polygon points="1460,571 1473,584 1460,597 1447,584" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/>
<text x="60" y="714" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Phase 4</text><text x="60" y="732" font-size="12.5" fill="#5E6779">Portfolio</text>
<rect x="1485" y="692" width="155" height="40" fill="#F2CFAF" stroke="#14213D" rx="2"/>
<polygon points="1639,688 1654,712 1639,736" fill="#F2CFAF" stroke="#14213D"/>
<text x="1485" y="685" font-size="11.5" fill="#5E6779">Mar 1 onward</text>
<text x="1085" y="752" font-size="12.5">Same engine in advising centers, queue management, a second scheduling portco</text>
<text x="1085" y="772" font-size="12"><tspan font-weight="600">Gate</tspan> Second portco live</text>
<rect x="60" y="849" width="22" height="14" fill="#F2CFAF" stroke="#14213D" rx="2"/><text x="90" y="860" font-size="12.5" fill="#5E6779">What ships</text>
<polygon points="215,846 226,856 215,866 204,856" fill="#F2D42C" stroke="#14213D" stroke-width="1.5"/><text x="238" y="860" font-size="12.5" fill="#5E6779">Gate - one metric, one threshold, and what happens if it fails</text>
<rect x="640" y="849" width="22" height="14" fill="#F2D42C" opacity=".28" stroke="#14213D" stroke-dasharray="3 3"/><text x="670" y="860" font-size="12.5" fill="#5E6779">December finals - phases 0 to 2 land before it</text>
<text x="1640" y="860" text-anchor="end" font-size="12" fill="#5E6779">October it's a report for ten directors · December it's the board · February it's a button</text>
</svg></div>
